name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the build supports, and the current release.
        node: ['22.12', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The tests never open a browser, and Chromium is a 150MB download.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 1

      - run: npm test
